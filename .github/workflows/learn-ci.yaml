name: Learn

on: push

jobs: 
  test:
    runs-on: ${{matrix.os}}
    strategy:
      matrix: 
        os: [ubuntu-latest, windows-latest, macos-latest]
        nodes: [18, 20, 21]

    steps:
      - uses: actions/checkout@v4 
      - uses: actions/setup-node@v4 
        with: 
          node-version: ${{matrix.nodes}}

      - run: npm ci
      - run: npm test      