name: Production Pipeline

on: 
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Сканування коду репозиторію
        uses: action/checkout@v4
      
      - name: Налаштування Node.js
        uses: action/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Встановлення залежностей
        run: npm ci

      - name: tests
        run: npm test 

      - name: Linting
        run: npm rum lint